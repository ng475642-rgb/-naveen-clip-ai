
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVEEN CLIP AI</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h2>✦ NAVEEN CLIP AI</h2>
</header>

<main>
  <h1>Turn long videos into <span>viral clips.</span></h1>

  <section>

    <button id="makeBtn" disabled>Find Best Clips ✨</button>
    <p id="status"></p>

  <div id="results"></div>

<script src="/app.js"></script>
</body>
</html>
